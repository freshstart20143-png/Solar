name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip
        run: unzip -q solarscout.zip
      - name: Fix
        run: |
          F=solarscout/app/src/main/assets/www/index.html
          J=solarscout/app/src/main/java/tw/solarscout/MainActivity.java
          sed -i 's#^\* { box-sizing: border-box; }$#* { box-sizing: border-box; }\n[hidden] { display: none !important; }#' $F
          sed -i 's#z-index: 1001; left: 50%#z-index: 1200; left: 50%#' $F
          sed -i 's#web = new WebView(this);#web = new WebView(this);\n        web.clearCache(true);#' $J
          grep -q 'display: none !important' $F
          grep -q 'clearCache' $J
      - name: Build
        run: cd solarscout && gradle :app:assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk ../SolarScout.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SolarScout v${{ github.run_number }}
          files: SolarScout.apk
          make_latest: true
