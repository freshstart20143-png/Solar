name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Arrange files
        run: |
          D=p/app/src/main
          mkdir -p $D/java/tw/solarscout $D/res/values $D/res/drawable $D/res/mipmap-anydpi $D/assets/www
          cp settings.gradle build.gradle gradle.properties p/
          cp app.build.gradle p/app/build.gradle
          cp s
