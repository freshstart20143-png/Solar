name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip
        run: unzip -q solarscout.zip
      - name: Build
        run: cd solarscout && gradle :app:assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk ../SolarScout.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SolarScout v${{ github.run_number }}
          files: SolarScout.apk
          make_latest: true
